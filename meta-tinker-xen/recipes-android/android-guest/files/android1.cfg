# Android 7.0 (AOSP, ARM32) guest with a screen. Start with "xl create /etc/xen/android1.cfg",
# console with "xl console android1" (Ctrl-] leaves), adb with
# "adb connect 192.168.100.3:5555" in dom0.
name = "android1"
kernel = "/var/lib/xen/android/zImage"
ramdisk = "/var/lib/xen/android/ramdisk.img"
# Screen: a Xen PV framebuffer, 800x480 at 16 bpp (RGB565, guest kernel patch
# 0003). qemu=0 becomes ro.kernel.qemu=0, which turns hardware-accelerated
# drawing (HWUI) off in every app: there is no GLES 2.0, so apps draw in
# software. Headless instead: drop the vfb line and replace the xen_fbfront
# and qemu options with "video=vfb:640x480-16@60 vfb.videomemorysize=4194304".
extra = "console=hvc0 androidboot.hardware=xen androidboot.console=hvc0 androidboot.selinux=permissive xen_fbfront.depth=16 xen_fbfront.video=2,800,480 qemu=0"
memory = 512
vcpus = 2
# CPUs 0-2 (CPU 3 is rtos1's)
cpus = "0-2"
disk = [ 'phy:/dev/disk/by-partlabel/android-system,xvda,r',
         'phy:/dev/disk/by-partlabel/android-data,xvdb,w' ]
vif = [ 'bridge=xenbr0' ]
# Screen and touch (absolute pointer, dom0's mouse/touchscreen) served by QEMU
# in dom0 as a VNC server on 127.0.0.1:5900, shown on HDMI by display-map.
# The "freeze 1-2 minutes after boot" of 2026-10-25 was Android suspending
# (s2idle) when its screen timed out, with nothing to wake the guest:
# init.xen.rc holds a wake lock and keeps the screen on.
vfb = [ 'vnc=1,vnclisten=127.0.0.1,vncdisplay=0' ]
