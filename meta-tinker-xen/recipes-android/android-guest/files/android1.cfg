# Headless Android 7.0 (AOSP, ARM32) guest. Start with "xl create /etc/xen/android1.cfg",
# console with "xl console android1" (Ctrl-] leaves), adb with
# "adb connect 192.168.100.3:5555" in dom0.
name = "android1"
kernel = "/var/lib/xen/android/zImage"
ramdisk = "/var/lib/xen/android/ramdisk.img"
# video=vfb: a RAM-only framebuffer that SurfaceFlinger renders into (headless)
extra = "console=hvc0 androidboot.hardware=xen androidboot.console=hvc0 androidboot.selinux=permissive video=vfb:640x480-16@60 vfb.videomemorysize=4194304"
memory = 768
vcpus = 2
disk = [ 'phy:/dev/disk/by-partlabel/android-system,xvda,r',
         'phy:/dev/disk/by-partlabel/android-data,xvdb,w' ]
vif = [ 'bridge=xenbr0' ]
# EXPERIMENTAL, off: screen + touch through a Xen PV framebuffer (800x600,
# 16 bpp) and absolute pointer, served by QEMU in dom0 as a VNC server on
# 127.0.0.1:5900, shown on HDMI by android-hdmi (ENABLED=1 in
# /etc/default/android-hdmi). To try it: uncomment the vfb line, replace the
# video=vfb:... options in "extra" with xen_fbfront.depth=16, and add
# ro.kernel.qemu=0 to the ramdisk's default.prop (apps must draw in software:
# there is no GLES 2.0). Known problem (2026-10-25): with apps drawing in
# software the guest stops taking timer interrupts and freezes 1-2 minutes
# after boot (diagnostics/REPORT.md section Y).
#vfb = [ 'vnc=1,vnclisten=127.0.0.1,vncdisplay=0' ]
