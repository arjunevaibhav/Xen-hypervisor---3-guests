# FreeRTOS guest: bare-metal zImage, 4 MB (it uses ~130 KB), 1 vCPU, no devices.
# Its output appears on the Xen console (the board's UART) as "(dN) [rtos] ...";
# that needs a debug Xen build (CONFIG_VERBOSE_DEBUG).
#   rtos1-start   (CPU pool + xl create + RTDS reservation)    xl list    xl destroy rtos1
name   = "rtos1"
kernel = "/var/lib/xen/rtos1/freertos-xen-guest.bin"
memory = 4
vcpus  = 1
# Its own CPU (CPU 3) with the RTDS scheduler; rtos1-start creates the pool
# and gives rtos1 all of the CPU's time
pool   = "rt"
