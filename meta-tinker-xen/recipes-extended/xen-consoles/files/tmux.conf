# tmux on the Tinker Board serial console (see /usr/sbin/consoles)

# Click a pane to type in it, drag a border to resize, wheel to scroll back
set -g mouse on
# Escape sequences arrive slowly over 115200 baud; don't mistake them for Esc
set -s escape-time 50
set -g history-limit 5000
# Pane names (dom0 / rtos1 / android1 / media1) on each pane's top border
set -g pane-border-status top
set -g pane-border-format " #{pane_index}: #{pane_title} "
set -g status-right " Ctrl-b z: zoom pane | Ctrl-b d: leave "
set -g status-right-length 50
