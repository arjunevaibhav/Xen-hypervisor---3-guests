# media1 (domain 4): Yocto Linux guest that plays videos and pictures.
# Start with "xl create /etc/xen/media1.cfg" (xen-guests does it at boot),
# console with "xl console media1" (Ctrl-] leaves), ssh root@192.168.100.4
# from dom0. Its screen is a PV framebuffer served by QEMU on
# 127.0.0.1:5901, shown by display-map (usb1 in /etc/default/display-map).
name = "media1"
# dom0's kernel: it has the Xen frontends (disk, network, framebuffer) built in
kernel = "/boot/zImage"
# xen_fbfront.video=<MB>,<width>,<height>: 800x480, the river clip's size
extra = "console=hvc0 root=/dev/xvda rw rootwait rootfstype=ext4 xen_fbfront.video=2,800,480"
memory = 192
# Software decode: two vCPUs, on CPUs 0-2 (CPU 3 is rtos1's)
vcpus = 2
cpus = "0-2"
disk = [ 'phy:/dev/disk/by-partlabel/media-root,xvda,w' ]
vif = [ 'bridge=xenbr0' ]
vfb = [ 'vnc=1,vnclisten=127.0.0.1,vncdisplay=1' ]
