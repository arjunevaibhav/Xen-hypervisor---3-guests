# Release Xen for ASUS Tinker Board (RK3288): no asserts, no verbose guest
# console (guests use their PV console, "xl console <name>").
# The real-time RTDS scheduler is only built by default in debug builds,
# so keep it explicitly: the FreeRTOS guest runs on it (cpupool "rt").
# The scheduler menu is only visible with EXPERT.
# CONFIG_DEBUG is not set
CONFIG_EXPERT=y
CONFIG_UNSUPPORTED=y
CONFIG_SCHED_RTDS=y
