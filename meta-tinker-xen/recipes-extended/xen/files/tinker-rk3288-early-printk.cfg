# Debug Xen build for ASUS Tinker Board (RK3288), used with XEN_TINKER_DEBUG = "1".
# Early printk on UART2 (serial@ff690000, snps,dw-apb-uart, reg-shift 2),
# the same port Linux uses as ttyS2 / stdout-path = "serial2:115200n8".
# Without this, Xen fails silently if it is not entered in NS Hyp mode.
# Note: early printk hard-codes the UART address, so this Xen is board-specific.
CONFIG_DEBUG=y
CONFIG_EARLY_UART_CHOICE_8250=y
CONFIG_EARLY_UART_BASE_ADDRESS=0xff690000
CONFIG_EARLY_UART_8250_REG_SHIFT=2
