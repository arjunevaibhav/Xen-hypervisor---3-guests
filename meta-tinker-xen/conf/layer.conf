# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-tinker-xen"
BBFILE_PATTERN_meta-tinker-xen = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-tinker-xen = "10"

LAYERDEPENDS_meta-tinker-xen = "core"
LAYERSERIES_COMPAT_meta-tinker-xen = "kirkstone"
